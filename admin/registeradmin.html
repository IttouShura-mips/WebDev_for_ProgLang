<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Admin Account</title>
    <style>
                
        :root {
            --bg-deep-abyss: #020c1b;      /* Deep dark oceanic background */
            --bg-card: #0a192f;            /* Dark teal-tinted card background */
            --bg-card-hover: #112240;      /* Elevated glass depth background */
            --primary-neon: #0df5e3;       /* Bioluminescent vibrant teal */
            --primary-neon-hover: #00cbb9; /* Slightly darker neon active */
            --text-high-contrast: #e2e8f0; /* Crisp white-silver */
            --text-muted-teal: #8892b0;    /* Soft teal gray */
            --border-teal: #172a45;        /* Subdued border color */
            --success-green: #10b981;      
            --border-radius: 12px;
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --neon-glow: 0 0 15px rgba(13, 245, 227, 0.3);
        }

        body {
                background: radial-gradient(circle at center, #071f30, var(--bg-deep-abyss));
        }

        .container {
            justify-content: center;
            display: flex;
            margin-top: 10px;

        } 

        form {
            box-shadow: 0 0px 30px rgba(13, 245, 227, 0.3);
            background-color: var(--bg-deep-abyss);
            text-align: center;
            justify-content: center;
            align-items: center;margin-top: 15%;
            padding: 30px;
            border-radius: 50px;
            width: 600px;
        }

        form h2 {
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-high-contrast);
        }

        .form-header p {
            color: var(--text-high-contrast);
            font-size: 20px;
        }

        .form-header h1 {
            font-size: 50px;
            font-style: italic;
            color: var(--primary-neon);
        }

        .login-card input {
            color: var(--text-high-contrast);
            border-radius: 50px;
            margin: 10px 15px;
            padding-left: 20px;
            height: 40px;
            width: 500px;
            border: 1px solid var(--primary-neon);
            background-color: var(--bg-card-hover);
        }

        .login-button {
            font-weight: 700;
            font-size: 16px;
            color: var(--primary-neon);
            border: 1px solid var(--primary-neon);
            background-color: transparent;
            margin-top: 20px;
            border-radius: 25px;
            height: 40px;
            width: 100px;
            cursor: pointer;
        }

        .login-button:hover { 
            transition: 0.4s;
            transform: scale(1.1);
            color: var(--text-high-contrast);
            background-color: var(--primary-neon);
        }

        .register  {
            margin-left: 125px;
            font-weight: 700;
            font-size: 20px;
            color: var(--primary-neon);
            border: 1px solid var(--primary-neon);
            background-color: transparent;
            margin-top: 20px;
            border-radius: 25px;
            height: 30px;
            width: 100px;
            cursor: pointer;
            padding: 5px 0;
            text-decoration: none;
        }

        .register:hover { 
            transition: 0.4s;
            transform: scale(1.1);
            color: var(--text-high-contrast);
            background-color: var(--primary-neon);
        }

        form a {
            text-decoration: none;
        }

        /* --- Media Queries for Admin Register --- */

        /* ==========================================================================
        1. Tablets and Smaller Desktops (Max-width: 768px)
        ========================================================================== */
        @media (max-width: 768px) {
            body {
                padding: 40px 0;
                min-height: 100vh;
                display: flex;
                align-items: center; /* Vertically centers the form on tablets */
            }

            .container {
                width: 100%;
                padding: 0 20px;
            }

            form {
                width: 100%;          /* Switches from fixed 600px to fluid width */
                max-width: 480px;     /* Prevents form from expanding too wide */
                margin-top: 0;        /* Removes the 15% desktop margin in favor of flex centering */
                padding: 40px 25px;
                border-radius: 30px;  /* Slightly softer corners on mobile viewports */
            }

            .login-card input {
                width: 100%;          /* Inputs fluidly fill 100% of the parent form */
                max-width: 100%;
                margin: 10px 0;       /* Removes the 15px horizontal margin that causes edge clipping */
            }
        }

        /* ==========================================================================
        2. Smartphones and Small Displays (Max-width: 480px)
        ========================================================================== */
        @media (max-width: 480px) {
            body {
                padding: 20px 0;
            }

            .container {
                padding: 0 15px;
            }

            form {
                padding: 30px 15px;
                border-radius: 20px;
            }

            form h2 {
                font-size: 22px;      /* Slightly scales down the header text */
            }

            .login-card input {
                height: 30px;         /* Taller input fields make it easier to type on touch screens */
                font-size: 15px;
                padding-left: 15px;
                width: auto;
            }

            .login-button {
                width: 80%;           /* Stretches the sign-up button slightly for easier thumb access */
                max-width: 200px;
                height: 45px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

    <form> 
  
        <h2>Create a Admin Account</h2>

        <div class="login-card">
            <input type="text" id="username" required placeholder="Enter your Username">
        </div>

        <div class="login-card">
            <input type="text" id="password" required placeholder="Enter your Password">
        </div>

        <div class="login-card">
            <input type="text" id="password" required placeholder="Re-Enter your Password">
        </div>

        <button type="submit" class="login-button">Sign - Up</button>


    </form>

    </div>
    
</body>
</html>
