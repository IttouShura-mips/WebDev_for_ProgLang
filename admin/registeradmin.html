<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Admin Account | ICF Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep-abyss: #020c1b;
            --bg-card: #0a192f;
            --bg-card-hover: #112240;
            --primary-neon: #0df5e3;
            --primary-neon-hover: #00cbb9;
            --text-high-contrast: #e2e8f0;
            --text-muted-teal: #8892b0;
            --border-teal: #172a45;
            --border-radius: 12px;
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --neon-glow: 0 0 15px rgba(13, 245, 227, 0.3);
        }
        body {
            background: radial-gradient(circle at center, #071f30, var(--bg-deep-abyss));
            font-family: 'Inter', sans-serif;
            color: var(--text-high-contrast);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            justify-content: center;
            display: flex;
            width: 100%;
        }
        form {
            box-shadow: 0 0px 30px rgba(13, 245, 227, 0.3);
            background-color: var(--bg-deep-abyss);
            text-align: center;
            justify-content: center;
            align-items: center;
            padding: 40px;
            border-radius: 30px;
            width: 100%;
            max-width: 600px;
            border: 1px solid var(--border-teal);
        }
        form h2 {
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-high-contrast);
            margin-bottom: 10px;
            font-size: 28px;
        }
        .form-header p {
            color: var(--text-muted-teal);
            font-size: 14px;
            margin-bottom: 25px;
        }
        .login-card {
            width: 100%;
            margin-bottom: 15px;
        }
        .login-card input {
            color: var(--text-high-contrast);
            border-radius: 50px;
            padding: 0 20px;
            height: 48px;
            width: 100%;
            border: 1px solid var(--border-teal);
            background-color: var(--bg-card-hover);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: var(--transition-smooth);
        }
        .login-card input:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 12px rgba(13, 245, 227, 0.25);
        }
        .action-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .login-button {
            font-weight: 700;
            font-size: 15px;
            color: var(--bg-deep-abyss);
            border: 1px solid var(--primary-neon);
            background-color: var(--primary-neon);
            border-radius: 25px;
            height: 44px;
            padding: 0 30px;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: var(--neon-glow);
        }
        .login-button:hover {
            transform: translateY(-2px);
            background-color: var(--primary-neon-hover);
            box-shadow: 0 0 20px rgba(13, 245, 227, 0.5);
        }
        .back-link {
            font-weight: 600;
            font-size: 14px;
            color: var(--primary-neon);
            border: 1px solid var(--border-teal);
            background-color: transparent;
            border-radius: 25px;
            height: 44px;
            line-height: 42px;
            padding: 0 25px;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition-smooth);
            display: inline-block;
        }
        .back-link:hover {
            border-color: var(--primary-neon);
            background-color: rgba(13, 245, 227, 0.1);
            color: var(--text-high-contrast);
        }
        .error { color: #ef4444; font-size: 13px; margin-top: 5px; display: none; }
        @media (max-width: 480px) {
            form { padding: 30px 20px; border-radius: 20px; }
            form h2 { font-size: 22px; }
            .login-card input { height: 44px; }
            .action-group { flex-direction: column; }
            .login-button, .back-link { width: 100%; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <form action="../backend/AdminDB/registeradmin.php" method="POST" autocomplete="off">
            <h2>Create Admin Account</h2>
            <div class="form-header">
                <p>Register a new administrator for the ICF Portal</p>
            </div>
            <div class="login-card">
                <input type="text" name="full_name" id="full_name" required placeholder="Full Name">
            </div>
            <div class="login-card">
                <input type="text" name="username" id="username" required placeholder="Username">
            </div>
            <div class="login-card">
                <input type="email" name="email" id="email" required placeholder="Email Address">
            </div>
            <div class="login-card">
                <input type="password" name="password" id="password" required placeholder="Password" minlength="6">
            </div>
            <div class="login-card">
                <input type="password" name="confirm_password" id="confirm_password" required placeholder="Confirm Password" minlength="6">
            </div>
            <div class="action-group">
                <button type="submit" class="login-button">Sign Up</button>
                <a href="../admin/login.html" class="back-link">Back to Login</a>
            </div>
        </form>
    </div>
</body>
</html>
