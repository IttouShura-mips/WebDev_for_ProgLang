<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Log In | ICF Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-deep-abyss: #020c1b;
            --bg-card: #0a192f;
            --bg-card-hover: #112240;
            --primary-neon: #0df5e3;
            --primary-neon-hover: #00cbb9;
            --text-high-contrast: #e2e8f0;
            --text-muted-teal: #8892b0;
            --border-teal: #172a45;
            --border-radius: 12px;
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --neon-glow: 0 0 15px rgba(13, 245, 227, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #071f30, var(--bg-deep-abyss));
            color: var(--text-high-contrast);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-card);
            border: 1px solid var(--border-teal);
            border-radius: 30px;
            box-shadow: 0 0px 35px rgba(13, 245, 227, 0.2);
            padding: 50px 60px;
            max-width: 950px;
            width: 100%;
            transition: var(--transition-smooth);
        }
        .container:hover {
            box-shadow: 0 0px 40px rgba(13, 245, 227, 0.3);
            border-color: rgba(13, 245, 227, 0.4);
        }
        .header {
            padding-right: 50px;
            border-right: 1px solid var(--border-teal);
            align-items: center;
            display: flex;
            gap: 20px;
            flex: 1;
        }
        .header-text-group { display: flex; flex-direction: column; }
        .header h1 {
            animation: revealInLeftToRight 1.5s cubic-bezier(0.1, 1, 0.22, 1);
            font-size: 38px; font-weight: 800; color: var(--primary-neon); line-height: 1.1;
        }
        .header span {
            font-size: 13px; font-weight: 600; color: var(--text-muted-teal);
            letter-spacing: 1.5px; margin-top: 8px; text-transform: uppercase;
        }
        .header img { height: 90px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(13, 245, 227, 0.2)); }
        form {
            padding-left: 50px; text-align: center; display: flex;
            flex-direction: column; align-items: center; justify-content: center; flex: 1;
        }
        .form-header { margin-bottom: 25px; }
        .form-header h1 { font-size: 32px; font-weight: 800; color: var(--text-high-contrast); letter-spacing: 0.5px; }
        .form-header p { color: var(--text-muted-teal); font-size: 14px; margin-top: 5px; }
        .login-card { width: 100%; display: flex; justify-content: center; }
        .login-card input {
            color: var(--text-high-contrast); border-radius: 50px; margin: 10px 0;
            padding: 0 20px; height: 48px; width: 100%; max-width: 320px;
            border: 1px solid var(--border-teal); background-color: var(--bg-deep-abyss);
            font-family: inherit; font-size: 14px; outline: none; transition: var(--transition-smooth);
        }
        .login-card input:focus {
            border-color: var(--primary-neon); box-shadow: 0 0 12px rgba(13, 245, 227, 0.25);
        }
        .action-group {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; max-width: 320px; margin-top: 20px;
        }
        .login-button {
            font-weight: 700; font-size: 15px; color: var(--bg-deep-abyss);
            border: 1px solid var(--primary-neon); background-color: var(--primary-neon);
            border-radius: 25px; height: 44px; padding: 0 25px; cursor: pointer;
            transition: var(--transition-smooth); box-shadow: var(--neon-glow);
        }
        .login-button:hover {
            transform: translateY(-2px); background-color: var(--primary-neon-hover);
            box-shadow: 0 0 20px rgba(13, 245, 227, 0.5);
        }
        .register {
            font-weight: 600; font-size: 14px; color: var(--primary-neon);
            border: 1px solid var(--border-teal); background-color: transparent;
            border-radius: 25px; height: 44px; line-height: 42px; padding: 0 20px;
            cursor: pointer; text-decoration: none; transition: var(--transition-smooth); display: inline-block;
        }
        .register:hover {
            border-color: var(--primary-neon); background-color: rgba(13, 245, 227, 0.1);
            color: var(--text-high-contrast);
        }
        .error-msg {
            color: #ef4444; font-size: 13px; margin-top: 10px; display: none;
        }
        @keyframes revealInLeftToRight {
            0% { opacity: 0; clip-path: inset(0 100% 0 0); transform: translateX(-30px); }
            15% { opacity: 1; }
            100% { opacity: 1; clip-path: inset(0 0 0 0); transform: translateX(0); }
        }
        @media (max-width: 992px) {
            .container { flex-direction: column; padding: 40px 25px; max-width: 500px; }
            .header { border-right: none; border-bottom: 1px solid var(--border-teal);
                padding-right: 0; padding-bottom: 25px; flex-direction: column; text-align: center; width: 100%; }
            .header h1 { font-size: 32px; margin-top: 10px; }
            form { width: 100%; padding-left: 0; padding-top: 25px; }
        }
        @media (max-width: 480px) {
            .container { padding: 30px 15px; border-radius: 20px; }
            .header img { height: 75px; }
            .header h1 { font-size: 26px; }
            .form-header h1 { font-size: 24px; }
            .action-group { flex-direction: column; gap: 12px; }
            .login-button, .register { width: 100%; max-width: 280px; height: 45px; text-align: center; }
            .register { line-height: 43px; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="../BackGroundimage/ICFLogo.png" alt="ICF Logo">
            <div class="header-text-group">
                <h1>ICF</h1>
                <span>Interworld Colleges Foundation Inc.</span>
            </div>
        </div>
        <form action="../backend/AdminDB/adminlogin.php" method="POST" autocomplete="off">
            <div class="form-header">
                <h1>WELCOME!</h1>
                <p>Please log in to Admin dashboard</p>
            </div>
            <div class="login-card">
                <input type="text" name="username" id="username" autocomplete="off" required placeholder="Username or Email">
            </div>
            <div class="login-card">
                <input type="password" name="password" id="password" autocomplete="off" required placeholder="Password">
            </div>
            <div class="action-group">
                <button type="submit" class="login-button">Log In</button>
                <a href="registeradmin.html" class="register">Register</a>
            </div>
        </form>
    </div>
</body>
</html>
