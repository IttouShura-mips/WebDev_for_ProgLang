<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    
    
    <style>
                :root {
                    --bg-deep-abyss: #020c1b;      /* Deep dark oceanic background */
                    --bg-card: #0a192f;            /* Dark teal-tinted card background */
                    --bg-card-hover: #112240;      /* Elevated glass depth background */
                    --primary-neon: #0df5e3;       /* Bioluminescent vibrant teal */
                    --primary-neon-hover: #00cbb9; /* Slightly darker neon active */
                    --text-high-contrast: #e2e8f0; /* Crisp white-silver */
                    --text-muted-teal: #8892b0;    /* Soft teal gray */
                    --border-teal: #172a45;        /* Subdued border color */
                    --success-green: #10b981;      
                    --border-radius: 12px;
                    --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
                    --neon-glow: 0 0 15px rgba(13, 245, 227, 0.3);
                }

                * {
                    box-sizing: border-box;
                    margin: 0;
                    padding: 0;
                }

                body {
                    font-family: 'Inter', sans-serif;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    min-height: 100vh;
                    background: radial-gradient(circle at center, #071f30, var(--bg-deep-abyss));
                    color: var(--text-high-contrast);
                    padding: 20px;
                }

                .container {
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    box-shadow: 0 0px 30px rgba(13, 245, 227, 0.2);
                    border-radius: 30px;
                    background-color: var(--bg-card);
                    border: 1px solid var(--border-teal);
                    width: 480px;
                    height: auto;
                    padding: 40px;
                    transition: var(--transition-smooth);
                } 

                .container:hover {
                    box-shadow: 0 0px 35px rgba(13, 245, 227, 0.3);
                    border-color: rgba(13, 245, 227, 0.4);
                }

                .header {
                    text-align: center;
                }

                .header h1 {
                    font-size: 32px;
                    font-weight: 800;
                    color: var(--primary-neon);
                    margin-top: 10px;
                }

                .header h4 {
                    color: var(--text-muted-teal);
                    font-weight: 400;
                    font-size: 14px;
                    margin-top: 4px;
                }

                .header img {
                    height: 100px;
                    object-fit: contain;
                    filter: drop-shadow(0 0 10px rgba(13, 245, 227, 0.2));
                }

                form {
                    padding-top: 25px;
                    border-top: 1px solid var(--border-teal);
                    margin-top: 30px;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    text-align: center;
                }

                .form-header h1 {
                    font-size: 24px;
                    font-weight: 700;
                    color: var(--text-high-contrast);
                }

                .form-header p {
                    font-size: 14px;
                    color: var(--text-muted-teal);
                    margin-top: 5px;
                    margin-bottom: 20px;
                }

                .login-card {
                    width: 100%;
                    display: flex;
                    justify-content: center;
                }

                .login-card input {
                    color: var(--text-high-contrast);
                    border-radius: 50px;
                    margin: 10px 0;
                    padding: 0 20px;
                    height: 48px;
                    width: 100%;
                    max-width: 340px;
                    border: 1px solid var(--border-teal);
                    background-color: var(--bg-deep-abyss);
                    font-family: inherit;
                    font-size: 14px;
                    outline: none;
                    transition: var(--transition-smooth);
                }

                .login-card input:focus {
                    border-color: var(--primary-neon);
                    box-shadow: 0 0 12px rgba(13, 245, 227, 0.25);
                }

                .action-group {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    width: 100%;
                    max-width: 340px;
                    margin-top: 20px;
                }

                .login-button {
                    font-weight: 700;
                    font-size: 15px;
                    color: var(--bg-deep-abyss);
                    border: 1px solid var(--primary-neon);
                    background-color: var(--primary-neon);
                    border-radius: 25px;
                    height: 44px;
                    padding: 0 25px;
                    cursor: pointer;
                    transition: var(--transition-smooth);
                    box-shadow: var(--neon-glow);
                }

                .login-button:hover { 
                    transform: translateY(-2px);
                    background-color: var(--primary-neon-hover);
                    box-shadow: 0 0 20px rgba(13, 245, 227, 0.5);
                }

                .register {
                    font-weight: 600;
                    font-size: 14px;
                    color: var(--primary-neon);
                    border: 1px solid var(--border-teal);
                    background-color: transparent;
                    border-radius: 25px;
                    height: 44px;
                    line-height: 42px;
                    padding: 0 20px;
                    cursor: pointer;
                    text-decoration: none;
                    transition: var(--transition-smooth);
                    display: inline-block;
                }

                .register:hover { 
                    border-color: var(--primary-neon);
                    background-color: rgba(13, 245, 227, 0.1);
                    color: var(--text-high-contrast);
                }

                form a {
                    text-decoration: none;
                }

                /* --- Media Queries --- */

                /* ==========================================================================
                1. Tablets and Small Desktops (Max-width: 768px)
                ========================================================================== */
                @media (max-width: 768px) {
                    body {
                        align-items: center;
                        min-height: 100vh;
                        padding: 20px 10px;
                    }

                    .container {
                        width: 90%;          /* Dynamic width replaces the fixed 500px */
                        max-width: 450px;
                        height: auto;        /* Fluid height lets content breathe naturally */
                        padding: 40px 25px;
                        margin-top: 0;
                    }

                    .header h1 {
                        font-size: 28px;
                    }

                    form {
                        margin-top: 25px;
                        padding-top: 20px;
                    }

                    .login-card input {
                        width: 100%;         /* Inputs dynamically scale to fit container */
                        max-width: 320px;
                    }
                }

                /* ==========================================================================
                2. Smartphones and Small Screens (Max-width: 480px)
                ========================================================================== */
                @media (max-width: 480px) {
                    .container {
                        width: 95%;
                        padding: 30px 20px;
                        border-radius: 20px;
                        box-shadow: 0 0px 20px rgba(13, 245, 227, 0.2);
                    }

                    .header img {
                        height: 80px;
                    }

                    .header h1 {
                        font-size: 24px;
                    }

                    .header h4 {
                        font-size: 12px;     /* Keeps the long school title readable */
                    }

                    .form-header h1 {
                        font-size: 20px;
                    }

                    .form-header p {
                        font-size: 13px;
                    }

                    .action-group {
                        flex-direction: column;
                        gap: 12px;
                    }

                    .login-button, .register {
                        display: block;      /* Stack elements vertically */
                        width: 100%;         /* Larger touch target for thumbs */
                        max-width: 280px;
                        height: 45px;
                        text-align: center;
                    }

                    .register {
                        line-height: 43px;
                    }
                }
    </style>               
</head>
<body>

    <div class="container">

        <div class="header">
            <img src="../BackGroundimage/ICFLogo.png" alt="ICF Logo">
            <h1>ICF Portal</h1>
            <h4>Interworld Colleges Foundation Inc.</h4>
        </div>

        <form autocomplete="none"> 
            <div class="form-header">
                <h1>Welcome ICF'ians</h1>
                <p>You can now Log in to your Account</p>
            </div>

            <div class="login-card">
                <input type="text" id="username" autocomplete="none" required placeholder="Enter Your Username">
            </div>

            <div class="login-card">
                <input type="password" id="password" autocomplete="none" required placeholder="Password">
            </div>

            <div class="action-group">
                <button type="submit" class="login-button">Log In</button>
                <a href="registerstudent.html"><div class="register">Register</div></a>
            </div>
        </form>

    </div>
    
    </body>
</html>
