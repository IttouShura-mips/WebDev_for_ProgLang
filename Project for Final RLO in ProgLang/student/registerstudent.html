<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Student Account | ICF Online Portal</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
            :root {
                --bg-deep-abyss: #020c1b;      /* Deep dark oceanic background */
                --bg-card: #0a192f;            /* Dark teal-tinted card background */
                --bg-card-hover: #112240;      /* Elevated glass depth background */
                --primary-neon: #0df5e3;       /* Bioluminescent vibrant teal */
                --primary-neon-hover: #00cbb9; /* Slightly darker neon active */
                --text-high-contrast: #e2e8f0; /* Crisp white-silver */
                --text-muted-teal: #8892b0;    /* Soft teal gray */
                --border-teal: #172a45;        /* Subdued border color */
                --success-green: #10b981;      
                --border-radius: 12px;
                --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
                --neon-glow: 0 0 15px rgba(13, 245, 227, 0.3);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: 'Inter', sans-serif;
                background: radial-gradient(circle at center, #071f30, var(--bg-deep-abyss));
                color: var(--text-high-contrast);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 30px 15px;
            }

            .container {
                justify-content: center;
                display: flex;
                width: 100%;
                max-width: 600px;
            } 

            form {
                background-color: var(--bg-card);
                border: 1px solid var(--border-teal);
                box-shadow: 0 0px 30px rgba(13, 245, 227, 0.2);
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 40px;
                border-radius: 30px;
                width: 100%;
                transition: var(--transition-smooth);
            }

            form:hover {
                box-shadow: 0 0px 35px rgba(13, 245, 227, 0.3);
                border-color: rgba(13, 245, 227, 0.4);
            }

            form h2 {
                font-weight: 800;
                font-size: 28px;
                letter-spacing: 0.5px;
                color: var(--primary-neon);
                margin-bottom: 25px;
            }

            .form-header p {
                color: var(--text-muted-teal);
                font-size: 16px;
                margin-bottom: 10px;
            }

            .form-header h1 {
                font-size: 36px;
                font-weight: 800;
                color: var(--primary-neon);
            }

            .login-card {
                width: 100%;
                display: flex;
                justify-content: center;
            }

            .login-card input {
                color: var(--text-high-contrast);
                border-radius: 50px;
                margin: 8px 0;
                padding: 0 20px;
                height: 48px;
                width: 100%;
                max-width: 480px;
                border: 1px solid var(--border-teal);
                background-color: var(--bg-deep-abyss);
                font-family: inherit;
                font-size: 14px;
                outline: none;
                transition: var(--transition-smooth);
            }

            .login-card input:focus {
                border-color: var(--primary-neon);
                box-shadow: 0 0 12px rgba(13, 245, 227, 0.25);
            }

            .action-group {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 15px;
                width: 100%;
                max-width: 480px;
                margin-top: 20px;
            }

            .login-button {
                font-weight: 700;
                font-size: 15px;
                color: var(--bg-deep-abyss);
                border: 1px solid var(--primary-neon);
                background-color: var(--primary-neon);
                border-radius: 25px;
                height: 46px;
                padding: 0 30px;
                cursor: pointer;
                transition: var(--transition-smooth);
                box-shadow: var(--neon-glow);
            }

            .login-button:hover { 
                transform: translateY(-2px);
                background-color: var(--primary-neon-hover);
                box-shadow: 0 0 20px rgba(13, 245, 227, 0.5);
            }

            .back-login {
                font-weight: 600;
                font-size: 14px;
                color: var(--primary-neon);
                border: 1px solid var(--border-teal);
                background-color: transparent;
                border-radius: 25px;
                height: 46px;
                line-height: 44px;
                padding: 0 20px;
                cursor: pointer;
                text-decoration: none;
                transition: var(--transition-smooth);
                display: inline-block;
            }

            .back-login:hover { 
                border-color: var(--primary-neon);
                background-color: rgba(13, 245, 227, 0.1);
                color: var(--text-high-contrast);
            }

            form a {
                text-decoration: none;
            }

            /* --- Media Queries for Registration Form --- */

            /* ==========================================================================
            1. Tablets and Small Desktops (Max-width: 768px)
            ========================================================================== */
            @media (max-width: 768px) {
                body {
                    padding: 20px 10px;
                }

                .container {
                    width: 100%;
                }

                form {
                    width: 100%;          
                    max-width: 500px;     
                    padding: 30px 20px;
                    border-radius: 25px;  
                }

                form h2 {
                    font-size: 24px;
                    margin-bottom: 20px;
                }

                .login-card input {
                    width: 100%;          
                    max-width: 100%;
                    margin: 8px 0;       
                }
            }

            /* ==========================================================================
            2. Smartphones and Smaller Displays (Max-width: 480px)
            ========================================================================== */
            @media (max-width: 480px) {
                form {
                    padding: 25px 15px;
                    border-radius: 20px;
                    box-shadow: 0 15px 25px rgba(0, 0, 0, 0.5); 
                }

                form h2 {
                    font-size: 20px;
                }

                .login-card input {
                    height: 44px;         
                    font-size: 14px;
                    padding-left: 15px;
                }

                .action-group {
                    flex-direction: column;
                    gap: 12px;
                }

                .login-button, .back-login {
                    width: 100%;           
                    max-width: 280px;
                    height: 45px;
                    font-size: 15px;
                    text-align: center;
                }

                .back-login {
                    line-height: 43px;
                }
            }

    </style>
    
</head>
<body>

    <div class="container">

        <form autocomplete="none"> 
      
            <h2>Create a Student Account</h2>

            <div class="login-card">
                <input type="text" id="fullname" autocomplete="none" required placeholder="Full Name">
            </div>

            <div class="login-card">
                <input type="text" id="middlename" autocomplete="none" required placeholder="Middle Name">
            </div>

            <div class="login-card">
                <input type="text" id="lastname" autocomplete="none" required placeholder="Last Name">
            </div>

            <div class="login-card">
                <input type="text" id="username" autocomplete="none" required placeholder="Username / Student ID">
            </div>

            <div class="login-card">
                <input type="password" id="password" autocomplete="none" required placeholder="Password">
            </div>

            <div class="action-group">
                <button type="submit" class="login-button">Sign Up</button>
                <a href="login.html"><div class="back-login">Back to Login</div></a>
            </div>

        </form>

    </div>
    
</body>
</html>
